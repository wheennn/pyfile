[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfile"
version = "0.1"
authors = [ { name = "wheennn" } ]
license = "MIT"
license-files = ["LICENSE"]
description = "Minimalistic TUI file explorer utility for devs"
dependencies = [
    "keyboard",
]

[project.scripts]
pyfile = "pyfile_package.main:main"

[tool.setuptools]
packages = ["pyfile_package"]

[project.urls]
Homepage = "https://github.com/wheennn/pyfile"